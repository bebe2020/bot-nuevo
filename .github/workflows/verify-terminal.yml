name: Verificar terminal integrada
on:
  workflow_dispatch:
  pull_request:
    paths: ['web/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: terminal-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate
